# Three-stage pipeline: unit / coverage / integration
# Mirrors Python, Java and Go SDK pipelines.
stages:
  - unit
  - coverage
  - integration

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target"

.rust_setup: &rust_setup
  - |
    if command -v rustup >/dev/null 2>&1; then
      echo "rustup: $(rustup --version)"
    elif command -v rustc >/dev/null 2>&1; then
      echo "rustc: $(rustc --version)"
    else
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      source "$HOME/.cargo/env"
    fi
  - rustc --version && cargo --version

unit:rust:
  stage: unit
  before_script:
    - *rust_setup
  script:
    - unset TIGEROPEN_TIGER_ID TIGEROPEN_PRIVATE_KEY TIGEROPEN_ACCOUNT TIGEROPEN_PROPS_PATH
    - cargo test --lib 2>&1
  artifacts:
    when: always
    expire_in: 1 week
  cache:
    key: rust-cargo
    paths:
      - .cargo/
      - target/

coverage:rust:
  stage: coverage
  before_script:
    - *rust_setup
    - cargo install cargo-tarpaulin --locked 2>/dev/null || true
  script:
    - unset TIGEROPEN_TIGER_ID TIGEROPEN_PRIVATE_KEY TIGEROPEN_ACCOUNT
    - cargo tarpaulin --lib --out Xml --output-dir coverage/ 2>&1
  coverage: '/coverage:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml
  cache:
    key: rust-cargo
    paths:
      - .cargo/
      - target/
  allow_failure: true

integration:rust:
  stage: integration
  allow_failure: true
  variables:
    TIGER_RUN_INTEG: "true"
  before_script:
    - *rust_setup
  script:
    - test -n "$TIGEROPEN_TIGER_ID" || test -n "$TIGEROPEN_PROPS_PATH" || { echo "No credentials — skipping"; exit 1; }
    - cargo test --test integ_quote --test integ_trade -- --nocapture 2>&1
  artifacts:
    when: always
    expire_in: 1 week
  cache:
    key: rust-cargo
    paths:
      - .cargo/
      - target/

# Pipeline result notification via a generic webhook (chat incoming
# webhook). WEBHOOK_URL is a masked CI Variable set in GitLab Settings; forks
# and PRs that don't configure it skip silently. notify failure never blocks.
notify:webhook:
  stage: .post
  when: always
  allow_failure: true
  dependencies: []
  script:
    - |
      if [ -z "$WEBHOOK_URL" ]; then
        echo "WEBHOOK_URL not configured, skipping notification"
        exit 0
      fi
      API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
      JOBS_JSON=$(curl -sS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${API}/pipelines/${CI_PIPELINE_ID}/jobs" 2>/dev/null || echo "[]")
      # Decide pass/fail from job statuses rather than CI_PIPELINE_STATUS,
      # which may still read "running" in a .post when:always job (GitLab
      # known behaviour). jobs API returns name+status only — no trace/secrets.
      # allow_failure soft-fails don't block the pipeline, so don't list them.
      HAS_FAILED="no"
      FAILED_JOBS=""
      if command -v python3 >/dev/null 2>&1; then
        OUT=$(printf '%s' "$JOBS_JSON" | python3 -c "import sys,json
      try:
        js=json.load(sys.stdin)
        failed=[j['name'] for j in js if j.get('status')=='failed' and not j.get('allow_failure')]
        print('yes' if failed else 'no')
        print(', '.join(failed))
      except Exception:
        print('no'); print('')
      " 2>/dev/null)
        HAS_FAILED=$(printf '%s\n' "$OUT" | sed -n '1p')
        FAILED_JOBS=$(printf '%s\n' "$OUT" | sed -n '2p')
      else
        echo "python3 not found, falling back to CI_PIPELINE_STATUS"
        if [ "$CI_PIPELINE_STATUS" = "failed" ]; then HAS_FAILED="yes"; fi
      fi
      TITLE="✅ Pipeline passed"
      COLOR="green"
      if [ "$HAS_FAILED" = "yes" ]; then
        TITLE="❌ Pipeline failed"
        COLOR="red"
      fi
      CONTENT="**Repo:** ${CI_PROJECT_NAME}\n**Branch:** ${CI_COMMIT_REF_NAME}\n**Commit:** ${CI_COMMIT_SHORT_SHA}\n"
      if [ -n "$FAILED_JOBS" ]; then
        CONTENT="${CONTENT}\n**Failed jobs:** ${FAILED_JOBS}\n"
      fi
      CONTENT="${CONTENT}[View pipeline](${CI_PROJECT_URL}/-/pipelines/${CI_PIPELINE_ID})"
      PAYLOAD=$(cat <<EOF
      {
        "msg_type": "interactive",
        "card": {
          "header": {
            "title": {"tag": "plain_text", "content": "$TITLE #${CI_PIPELINE_IID} — ${CI_PROJECT_NAME}"},
            "template": "$COLOR"
          },
          "elements": [
            {"tag": "div", "text": {"tag": os.environ["CARD_CONTENT_TAG"], "content": "$CONTENT"}}
          ]
        }
      }
      EOF
      )
      curl --fail -sS -X POST "$WEBHOOK_URL" \
        -H 'Content-Type: application/json' \
        -d "$PAYLOAD"
