# Three-stage pipeline: unit / coverage / integration
# Uses a Docker runner tagged 'openapi' (image: rust:1.85 ships cargo).
#
# Integration credentials: TIGEROPEN_TIGER_ID, TIGEROPEN_PRIVATE_KEY,
# TIGEROPEN_ACCOUNT env vars set in GitLab CI Variables (Protected + Masked).

stages:
  - unit
  - coverage
  - integration

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target"

.rust_base:
  image: rust:1.85
  tags:
    - openapi
  cache:
    key: rust-cargo-1.85
    paths:
      - .cargo/
      - target/

unit:rust:
  extends: .rust_base
  stage: unit
  script:
    - unset TIGEROPEN_TIGER_ID TIGEROPEN_PRIVATE_KEY TIGEROPEN_ACCOUNT TIGEROPEN_PROPS_PATH
    - cargo test --lib 2>&1

coverage:rust:
  extends: .rust_base
  stage: coverage
  allow_failure: true
  before_script:
    - cargo install cargo-tarpaulin --locked 2>/dev/null || true
  script:
    - unset TIGEROPEN_TIGER_ID TIGEROPEN_PRIVATE_KEY TIGEROPEN_ACCOUNT
    - cargo tarpaulin --lib --engine llvm --out Xml --output-dir coverage/ 2>&1
  coverage: '/coverage:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    paths: [coverage/]
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml
    expire_in: 1 week

integration:rust:
  extends: .rust_base
  stage: integration
  allow_failure: true
  variables:
    TIGER_RUN_INTEG: "true"
  script:
    - test -n "$TIGEROPEN_TIGER_ID" || test -n "$TIGEROPEN_PROPS_PATH" || { echo "No credentials — skipping"; exit 1; }
    - cargo test --test integ_quote --test integ_trade -- --nocapture 2>&1

# Pipeline result notification via a generic webhook (Feishu/Lark incoming
# webhook). WEBHOOK_URL is a masked CI Variable set in GitLab Settings; forks
# and PRs that don't configure it skip silently. notify failure never blocks.
notify:webhook:
  stage: .post
  when: always
  allow_failure: true
  dependencies: []
  script:
    - |
      if [ -z "$WEBHOOK_URL" ]; then
        echo "WEBHOOK_URL not configured, skipping notification"
        exit 0
      fi
      API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
      JOBS_JSON=$(curl --fail -sS --max-time 10 --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${API}/pipelines/${CI_PIPELINE_ID}/jobs" 2>/dev/null || echo "")
      HAS_FAILED="no"
      FAILED_JOBS=""
      if [ -n "$JOBS_JSON" ] && command -v python3 >/dev/null 2>&1; then
        OUT=$(printf '%s' "$JOBS_JSON" | python3 -c "import sys,json; js=json.load(sys.stdin); failed=[j['name'] for j in js if j.get('status')=='failed' and not j.get('allow_failure')]; print('yes' if failed else 'no'); print(', '.join(failed))" 2>/dev/null || printf 'no\n')
        HAS_FAILED=$(printf '%s\n' "$OUT" | sed -n '1p')
        FAILED_JOBS=$(printf '%s\n' "$OUT" | sed -n '2p')
      else
        echo "jobs API or python3 unavailable, falling back to CI_PIPELINE_STATUS"
        if [ "$CI_PIPELINE_STATUS" != "success" ]; then HAS_FAILED="yes"; fi
      fi
      TITLE="✅ Pipeline passed"
      COLOR="green"
      if [ "$HAS_FAILED" = "yes" ]; then
        TITLE="❌ Pipeline failed"
        COLOR="red"
      fi
      CONTENT="**Repo:** ${CI_PROJECT_NAME}\n**Branch:** ${CI_COMMIT_REF_NAME}\n**Commit:** ${CI_COMMIT_SHORT_SHA}\n"
      if [ -n "$FAILED_JOBS" ]; then
        CONTENT="${CONTENT}\n**Failed jobs:** ${FAILED_JOBS}\n"
      fi
      CONTENT="${CONTENT}[View pipeline](${CI_PROJECT_URL}/-/pipelines/${CI_PIPELINE_ID})"
      PAYLOAD=$(cat <<EOF
      {
        "msg_type": "interactive",
        "card": {
          "header": {
            "title": {"tag": "plain_text", "content": "$TITLE #${CI_PIPELINE_IID} — ${CI_PROJECT_NAME}"},
            "template": "$COLOR"
          },
          "elements": [
            {"tag": "div", "text": {"tag": "lark_md", "content": "$CONTENT"}}
          ]
        }
      }
      EOF
      )
      curl --fail -sS --max-time 10 -X POST "$WEBHOOK_URL" \
        -H 'Content-Type: application/json' \
        -d "$PAYLOAD"
