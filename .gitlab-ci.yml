# Three-stage pipeline: unit / coverage / integration
# Mirrors Python, Java and Go SDK pipelines.
stages:
  - unit
  - coverage
  - integration

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target"

.rust_setup: &rust_setup
  - |
    if command -v rustup >/dev/null 2>&1; then
      echo "rustup: $(rustup --version)"
    elif command -v rustc >/dev/null 2>&1; then
      echo "rustc: $(rustc --version)"
    else
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      source "$HOME/.cargo/env"
    fi
  - rustc --version && cargo --version

unit:rust:
  stage: unit
  before_script:
    - *rust_setup
  script:
    - unset TIGEROPEN_TIGER_ID TIGEROPEN_PRIVATE_KEY TIGEROPEN_ACCOUNT TIGEROPEN_PROPS_PATH
    - cargo test --lib 2>&1
  artifacts:
    when: always
    expire_in: 1 week
  cache:
    key: rust-cargo
    paths:
      - .cargo/
      - target/

coverage:rust:
  stage: coverage
  before_script:
    - *rust_setup
    - cargo install cargo-tarpaulin --locked 2>/dev/null || true
  script:
    - unset TIGEROPEN_TIGER_ID TIGEROPEN_PRIVATE_KEY TIGEROPEN_ACCOUNT
    - cargo tarpaulin --lib --out Xml --output-dir coverage/ 2>&1
  coverage: '/^\s*lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml
  cache:
    key: rust-cargo
    paths:
      - .cargo/
      - target/
  allow_failure: true

integration:rust:
  stage: integration
  allow_failure: true
  variables:
    TIGER_RUN_INTEG: "true"
  before_script:
    - *rust_setup
  script:
    - test -n "$TIGEROPEN_TIGER_ID" || test -n "$TIGEROPEN_PROPS_PATH" || { echo "No credentials — skipping"; exit 1; }
    - cargo test --test integ_quote --test integ_trade -- --nocapture 2>&1
  artifacts:
    when: always
    expire_in: 1 week
  cache:
    key: rust-cargo
    paths:
      - .cargo/
      - target/

notify:webhook:
  stage: .post
  when: always
  allow_failure: true
  dependencies: []
  script:
    - |
      [ -z "$WEBHOOK_URL" ] && exit 0
      STATUS="passed"
      curl --fail -sS -X POST "$WEBHOOK_URL" \
        -H 'Content-Type: application/json' \
        -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"${STATUS}: ${CI_PROJECT_NAME} #${CI_PIPELINE_IID} ${CI_COMMIT_REF_NAME}\"}}"
